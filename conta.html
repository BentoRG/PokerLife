<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="auth.js"></script>
    <title>Sua conta — PokerLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header login-header">
      <div class="brand">
        <h1>PokerLife</h1>
        <p class="subtitle">A vida até o que um herdeiro conhece</p>
      </div>
      <p class="login-title">Sua Conta</p>
    </header>

    <main class="table-main">
      <section class="account-card">
        <p>Nome de usuário: <span class="account-username"></span></p>
        <p>
          Email: <span class="account-email"></span>
          <button type="button" class="email-change" id="change-email">(trocar email)</button>
        </p>
        <form id="email-form" class="email-swap" hidden>
          <div class="field-stack">
            <input type="email" name="email" autocomplete="email" placeholder="Email novo" required />
            <button type="submit">Mudar</button>
          </div>
          <p class="form-error" role="alert" hidden></p>
        </form>

        <p>
          <button type="button" class="email-change" id="change-password">(trocar senha)</button>
        </p>
        <form id="password-form" class="email-swap" hidden>
          <div class="field-stack">
            <input type="email" name="email" autocomplete="email" placeholder="Seu email" required />
            <input
              type="password"
              name="password"
              autocomplete="new-password"
              placeholder="Senha nova"
              required
            />
            <input
              type="password"
              name="confirm"
              autocomplete="new-password"
              placeholder="Confirme a senha nova"
              required
            />
            <button type="submit">Mudar</button>
          </div>
          <p class="form-error" role="alert" hidden></p>
        </form>

        <h2>Seus itens:</h2>
        <ul class="account-items"></ul>

        <p class="account-money-line">Dinheiro: <span class="account-money"></span></p>
        <p>Mesada: <span class="account-mesada"></span></p>

        <h2>Registro bancário:</h2>
        <div class="account-ledger"></div>
      </section>

      <button type="button" class="account-logout" id="logout">Log out dessa conta</button>

      <p class="table-nav"><a href="index.html">Voltar à página inicial</a></p>
    </main>

    <script>
      document.getElementById("change-email").addEventListener("click", function () {
        var form = document.getElementById("email-form");
        form.hidden = false;
        form.querySelector("input").focus();
      });
      document.getElementById("change-password").addEventListener("click", function () {
        var form = document.getElementById("password-form");
        form.hidden = false;
        form.querySelector("input").focus();
      });
    </script>
  </body>
</html>
