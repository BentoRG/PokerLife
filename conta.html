<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="auth.js"></script>
    <title>Configurações & Seu Perfil — PokerLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header login-header">
      <div class="brand">
        <h1>PokerLife</h1>
        <p class="subtitle">A vida até o que um herdeiro conhece</p>
      </div>
      <p class="login-title">Configurações & Seu Perfil</p>
    </header>

    <main class="table-main">
      <section class="account-card">
        <p><span class="account-label">Nome de usuário:</span> <span class="account-username"></span></p>
        <p><span class="account-label">Email:</span> <span class="account-email"></span></p>

        <h2>Velocidade do jogo</h2>
        <p class="settings-note">
          Controla o tempo da distribuição das cartas, das apostas dos bots e das revelações.
        </p>
        <label class="speed-control">
          <span class="speed-control-label">Ritmo</span>
          <select id="game-speed" name="game-speed" aria-describedby="speed-hint">
            <option value="muito-lenta">Muito lenta</option>
            <option value="lenta">Lenta</option>
            <option value="normal">Normal</option>
            <option value="rapida">Rápida</option>
            <option value="muito-rapida">Muito rápida</option>
          </select>
        </label>
        <p id="speed-hint" class="settings-hint" hidden></p>

        <h2>Seus itens:</h2>
        <ul class="account-items"></ul>

        <p class="account-money-line"><span class="account-label">Dinheiro:</span> <span class="account-money"></span></p>
        <p><span class="account-label">Mesada:</span> <span class="account-mesada"></span></p>
      </section>

      <button type="button" class="account-logout" id="logout">Log out dessa conta</button>

      <p class="table-nav"><a href="index.html">Voltar à página inicial</a></p>
    </main>
  </body>
</html>
