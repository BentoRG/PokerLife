<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="auth.js"></script>
    <title>Cassino — PokerLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header login-header">
      <div class="brand">
        <h1>PokerLife</h1>

          Herdeiros milionários<br />
          aptos à prisão

    <main class="table-main">
      <p class="table-nav"><a href="index.html">Voltar à página inicial</a></p>
      <div id="table" class="felt"></div>
      <div class="controls">
        <div id="actions" class="actions"></div>
        <button type="button" id="play-bots">Play with bots</button>
        <button type="button" id="rebuy" hidden>Sentar de novo</button>
      </div>
      <ol id="log" class="hand-log" aria-live="polite"></ol>
    </main>

    <script src="poker.js"></script>
    <script src="cassino.js"></script>
