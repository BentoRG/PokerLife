<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="auth.js"></script>
    <title>Log in / Sign in — PokerLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header login-header">
      <div class="brand">
        <h1>PokerLife</h1>
        <p class="subtitle">A vida até o que um herdeiro conhece</p>
      </div>
      <p class="login-title">Log in /<br />Sign in</p>
    </header>

    <main class="login-main">
      <form id="login-form" class="auth-block">
        <h2 class="auth-heading">Se você já tem uma conta:</h2>
        <div class="field-stack">
          <input
            type="text"
            name="username"
            autocomplete="username"
            placeholder="Seu nome de usuário aqui"
            required
          />
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Sua senha aqui"
            required
          />
          <button type="submit">Entrar</button>
        </div>
        <p class="form-error" role="alert" hidden></p>
      </form>

      <form id="signup-form" class="auth-block">
        <h2 class="auth-heading">Para criar uma conta nova:</h2>
        <div class="field-stack">
          <input
            type="text"
            name="username"
            autocomplete="username"
            placeholder="Seu nome de usuário aqui"
            required
          />
          <input
            type="password"
            name="password"
            autocomplete="new-password"
            placeholder="Sua senha aqui"
            required
          />
          <input
            type="password"
            name="confirm"
            autocomplete="new-password"
            placeholder="Confirme sua senha aqui"
            required
          />
          <input
            type="email"
            name="email"
            autocomplete="email"
            placeholder="Seu email aqui"
            required
          />
          <button type="submit">Criar conta</button>
        </div>
        <p class="form-error" role="alert" hidden></p>
      </form>
    </main>
  </body>
</html>
