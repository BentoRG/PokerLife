<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="auth.js"></script>
    <title>Loja — PokerLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header home-header">
      <div class="brand">
        <h1>PokerLife</h1>
        <p class="subtitle">A vida até o que um herdeiro conhece</p>
      </div>
      <p class="welcome">Bem-Vindo, <span class="welcome-name"></span></p>
      <p class="login-title">Loja</p>
    </header>

    <main>
      <p class="balance">Você tem $150</p>
      <p class="allowance">
        <span class="allowance-waiting">Sua mesada de <span class="allowance-amount">$100</span> chega em <span class="countdown">00:00:00</span></span>
        <span class="allowance-ready" hidden>Receba sua mesada de <span class="allowance-amount">$100</span>.</span>
      </p>

      <div class="mode-select">
        <button type="button" id="buy-chips">Comprar fichas</button>
        <button type="button" id="buy-allowance">Comprar mesada</button>
        <p id="shop-notice" class="mode-notice" hidden role="status"></p>
      </div>

      <p class="table-nav"><a href="index.html">Voltar à página inicial</a></p>
    </main>

    <script>
      (function () {
        var notice = document.getElementById("shop-notice");
        var timer;
        function showUnavailable() {
          notice.hidden = false;
          notice.textContent = "essa funcionalidade ainda nao foi aplicada";
          clearTimeout(timer);
          timer = setTimeout(function () {
            notice.hidden = true;
            notice.textContent = "";
          }, 3200);
        }
        document.getElementById("buy-chips").addEventListener("click", showUnavailable);
        document.getElementById("buy-allowance").addEventListener("click", showUnavailable);
      })();
    </script>
  </body>
</html>
