<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="auth.js"></script>
    <title>Loja — PokerLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header login-header">
      <div class="brand">
        <h1>PokerLife</h1>
        <p class="subtitle">A vida até o que um herdeiro conhece</p>
      </div>
      <p class="login-title">Loja</p>
    </header>

    <main class="table-main">
      <div class="shop-grid">
        <article class="shop-item">
          <p class="item-name">Item 1</p>
          <p class="item-price">$40</p>
          <button type="button">Comprar</button>
        </article>
        <article class="shop-item">
          <p class="item-name">Item 2</p>
          <p class="item-price">$40</p>
          <button type="button">Comprar</button>
        </article>
        <article class="shop-item">
          <p class="item-name">Item 3</p>
          <p class="item-price">$40</p>
          <button type="button">Comprar</button>
        </article>
        <article class="shop-item">
          <p class="item-name">Item 4</p>
          <p class="item-price">$40</p>
          <button type="button">Comprar</button>
        </article>
        <article class="shop-item">
          <p class="item-name">Item 5</p>
          <p class="item-price">$40</p>
          <button type="button">Comprar</button>
        </article>
        <article class="shop-item">
          <p class="item-name">Item 6</p>
          <p class="item-price">$40</p>
          <button type="button">Comprar</button>
        </article>
      </div>
      <p id="shop-notice" class="mode-notice" hidden role="status"></p>
      <p class="table-nav"><a href="index.html">Voltar à<br />página inicial</a></p>
    </main>

    <script>
      (function () {
        var notice = document.getElementById("shop-notice");
        var timer;
        var buttons = document.querySelectorAll(".shop-item button");
        var i;
        function showUnavailable() {
          notice.hidden = false;
          notice.textContent = "essa funcionalidade ainda nao foi aplicada";
          clearTimeout(timer);
          timer = setTimeout(function () {
            notice.hidden = true;
            notice.textContent = "";
          }, 3200);
        }
        for (i = 0; i < buttons.length; i += 1) buttons[i].addEventListener("click", showUnavailable);
      })();
    </script>
  </body>
</html>
